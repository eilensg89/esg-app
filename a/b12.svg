<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2172 724" role="img" aria-labelledby="title desc">
  <title id="title">Acompañamiento ESG por hora</title>
  <desc id="desc">Botón de piedra marfil con borde dorado para acompañamiento ESG a 25 dólares por hora.</desc>
  <defs>
