      <stop offset="0" stop-color="#fff1d2"/><stop offset=".52" stop-color="#ead1a7"/><stop offset="1" stop-color="#d9b77f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a7"/><stop offset=".2" stop-color="#c88a27"/><stop offset=".48" stop-color="#f6d477"/><stop offset=".75" stop-color="#9c5b13"/><stop offset="1" stop-color="#edc45e"/>
    </linearGradient>
    <radialGradient id="med" cx="35%" cy="28%" r="75%">
