    <text x="706" y="390" font-family="Georgia,serif" font-size="56" fill="#6d3616">Orientación + apoyo práctico</text>
    <text x="706" y="467" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#8a531e" letter-spacing="2">POR HORA · PARA NEGOCIOS Y EMPRENDEDORES</text>
    <circle cx="1870" cy="362" r="83" fill="url(#gold)" stroke="#fff0a7" stroke-width="5"/>
    <path d="M1844 316 L1900 362 L1844 408" fill="none" stroke="#5a260a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
