<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#2b1207" />
  <title>Portal Maestro de Productos | ESG Experience™</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="leather-section">
  <main class="standalone-portal">
    <header class="standalone-portal-header">
      <img src="assets/logo-esg.png" alt="ESG Experience™" />
      <div><span class="eyebrow">POST-CONTRATACIÓN</span><h1>Portal Maestro de Productos</h1><p>Catálogo fijo · Catálogo a WhatsApp · Shopify</p></div>
    </header>
    <section class="standalone-card">
      <div class="detail-note"><b>Uso operativo.</b> Este portal no forma parte de la landing comercial y no solicita el precio del servicio ESG. Se utiliza después de contratar cuando el proyecto necesita carga estructurada de productos.</div>
      <div id="standalone-product-portal"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="portal-productos.js"></script>
</body>
</html>
